name: Release
on:
    push:
        tags:
            - "v*.*.*"
    workflow_dispatch:
        inputs:
            version:
                description: "Version tag to release (e.g. v1.0.0)"
                required: true
permissions:
    contents: write
jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v2
            - name: Install
              run: npm ci
            - name: Build
              run: npm run build:plus
            - name: Release
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: ${{ inputs.version || github.ref_name }}
                  target_commitish: ${{ github.sha }}
                  draft: false
                  generate_release_notes: true
                  files: dist/mushroom-plus.js
